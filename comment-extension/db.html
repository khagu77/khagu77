<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최종 DB - 카페·유튜브 댓글 수집기</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <img src="icons/icon128.png" alt="" class="logo">
        <h1>카페·유튜브 댓글 수집기</h1>
        <span class="ver" id="ver"></span>
      </div>
      <nav class="menu"><a href="app.html"><span class="num">1</span>💬 댓글 수집</a><a href="db.html" class="on"><span class="num">2</span>🗄 최종 DB</a></nav>
    </div>
  </header>
  <main>

    <p class="hint">
      그날그날 받은 최종 엑셀 파일을 이 PC 크롬에 날짜별로 보관합니다. <b>가장 위(최근 날짜) 파일이 '최종'</b>이며,
      댓글 수집에서 파일을 고르지 않으면 이 최종 파일에 이어 씁니다(‘별도 파일로 작성’을 켜면 제외).
      엑셀에서 직접 고친 파일은 그 날짜의 <b>수정본 올리기</b>로 바꿔 두세요.
    </p>

    <section data-kind="raw">
      <h2>댓글 raw data</h2>
      <div class="row"><button class="small register">파일 등록</button><span class="hint">지금까지의 최종 파일을 처음 넣을 때 · 파일명 앞 날짜(예: 20261019_…)의 날짜로 등록</span></div>
      <table class="dbtable"><thead><tr><th>날짜</th><th>파일</th><th>내용</th><th>수집 건수 (전일 대비)</th><th>저장</th><th></th></tr></thead><tbody></tbody></table>
    </section>

    <input type="file" id="picker" accept=".xlsx" hidden>
    <div id="dbInfo" class="summary"></div>
    <p class="note" id="usage"></p>
  </main>
  <script src="template.js"></script>
  <script src="cafe-common.js"></script>
  <script src="db-store.js"></script>
  <script src="db.js"></script>
</body>
</html>
