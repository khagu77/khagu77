# 현대차 온라인 이슈 모니터링 — Firebase 자동 배포
# hd-monitor 폴더가 바뀌어 올라오면 linesquare--monitor 프로젝트의 이 시스템 것만 배포
# (사이트 hd-issue-monitor · Firestore 데이터베이스 hdmon · Functions 묶음 hdmon — 기존 유튜브 시스템은 건드리지 않음)
# 필요: 저장소 Settings → Secrets and variables → Actions → FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 키 전체)
name: Deploy hd-monitor

on:
  push:
    branches: [claude/determined-pascal-9tkcwj, main]
    paths: ["hd-monitor/**", ".github/workflows/hd-monitor-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: hd-monitor-deploy
  cancel-in-progress: false

env:
  PROJECT: linesquare--monitor
  SITE: hd-issue-monitor
  DB: hdmon

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hd-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hd-monitor/functions/package-lock.json

      - name: 서비스 계정 키 확인
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 서비스 계정 JSON 키를 넣어 주세요 (hd-monitor/README.md 참고)"
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # 키 내용 점검 (비밀 값은 출력하지 않고 종류·계정 이메일·프로젝트만)
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::시크릿 내용이 JSON 이 아닙니다. 내려받은 .json 파일을 메모장으로 열어 { 부터 } 까지 전체를 붙여넣어 주세요 (" + e.message + ")"); process.exit(1); }
            console.log("키 종류:", j.type, "/ 계정:", j.client_email, "/ 프로젝트:", j.project_id);
            if (j.type !== "service_account" || !j.private_key || !j.client_email) { console.log("::error::서비스 계정 키(JSON)가 아닙니다. Google Cloud → 서비스 계정 → 키 → 새 키 만들기 → JSON 으로 받은 파일을 넣어 주세요"); process.exit(1); }
            if (j.project_id !== process.env.PROJECT) console.log("::warning::키의 프로젝트(" + j.project_id + ")가 " + process.env.PROJECT + " 가 아닙니다");
          ' "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 서비스 계정 키로 Google 로그인 확인
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth print-access-token >/dev/null && echo "Google 로그인 성공"
          gcloud projects describe "$PROJECT" --format="value(projectId)" || echo "::warning::프로젝트 정보를 읽지 못했습니다 (서비스 계정 역할 확인)"

      - name: 서버 패키지 설치 · 테스트
        working-directory: hd-monitor/functions
        run: |
          npm ci
          npm test

      - name: Firebase CLI 설치
        run: npm i -g firebase-tools

      - name: 웹 앱 등록 확인 (없으면 만들기 — 화면의 Firebase 설정 /__/firebase/init.json 에 필요)
        run: |
          if firebase apps:list WEB --project "$PROJECT" --non-interactive | grep -q ":web:"; then
            echo "웹 앱 있음"
          else
            firebase apps:create WEB "HD Issue Monitor" --project "$PROJECT" --non-interactive
          fi

      - name: 호스팅 사이트 준비 (없으면 만들기)
        run: |
          if firebase hosting:sites:get "$SITE" --project "$PROJECT" >/dev/null 2>&1; then
            echo "사이트 $SITE 있음"
          else
            firebase hosting:sites:create "$SITE" --project "$PROJECT" --non-interactive
          fi

      - name: Firestore 데이터베이스 준비 (없으면 서울에 만들기)
        run: |
          if firebase firestore:databases:get "$DB" --project "$PROJECT" >/dev/null 2>&1; then
            echo "데이터베이스 $DB 있음"
          else
            firebase firestore:databases:create "$DB" --location=asia-northeast3 --project "$PROJECT" --non-interactive
          fi

      - name: 배포 (이 시스템 것만)
        # 첫 배포 때 서울 리전 저장 공간·권한이 늦게 준비돼 일부 함수가 실패하는 경우가 있어 1분 뒤 한 번 더
        run: |
          for i in 1 2 3; do
            if firebase deploy --only "hosting:hdmon,functions:hdmon,firestore" --project "$PROJECT" --force --non-interactive; then exit 0; fi
            echo "::warning::배포 ${i}번째 시도 실패 — 60초 뒤 다시"
            sleep 60
          done
          exit 1

      - name: 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
