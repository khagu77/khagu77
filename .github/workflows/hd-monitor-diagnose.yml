# 점검(읽기 전용) — hd-monitor/diag/diagnose.mjs 가 바뀌어 올라오면 실행
name: Diagnose hd-monitor
on:
  push:
    branches: [claude/determined-pascal-9tkcwj]
    paths: ["hd-monitor/diag/**", ".github/workflows/hd-monitor-diagnose.yml"]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 점검
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCLOUD_PROJECT: linesquare--monitor
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd hd-monitor/functions && npm ci --silent
          cp ../diag/diagnose.mjs ./_diag.mjs && node _diag.mjs
          rm -f "$RUNNER_TEMP/sa.json"
