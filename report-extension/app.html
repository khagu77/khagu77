<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>온라인 오전동향 PPT 보고서 작성기</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>온라인 오전동향 PPT 보고서 작성기</h1>

    <details id="settings" class="settings">
      <summary>설정 <span id="settingsState" class="hint"></span></summary>
      <label for="templateFile">보고서 템플릿 PPT <span class="hint">(완성된 보고서 하나. 서식·안내선·4장 상세 슬라이드 모양을 그대로 따라갑니다. 한 번 넣으면 저장됩니다)</span></label>
      <input type="file" id="templateFile" accept=".pptx">
      <div id="templateInfo" class="hint"></div>

      <label for="aiKey">Claude API 키 <span class="hint">(본문·댓글 요약에 사용. 이 PC 크롬에만 저장. 없으면 엑셀 '주요 내용'으로 초안만 채움)</span></label>
      <input type="password" id="aiKey" placeholder="sk-ant-..." autocomplete="off">
      <label for="aiModel">AI 모델</label>
      <select id="aiModel"></select>

      <label for="ppi">그림 해상도 <span class="hint">(높을수록 선명하고 파일이 조금 커집니다. PowerPoint '그림 압축'과 같은 기준)</span></label>
      <select id="ppi">
        <option value="330">고화질 330ppi (기본 · 가장 선명)</option>
        <option value="220">인쇄 220ppi</option>
        <option value="150">화상 150ppi (가장 작은 파일)</option>
      </select>

      <label for="fileName">파일 이름 <span class="hint">({날짜} 자리에 보고서 날짜가 YYMMDD 로 들어갑니다)</span></label>
      <input type="text" id="fileName" value="{날짜}_현대차 온라인 이슈 보고서">
    </details>

    <label for="excelFile">오늘 수집한 부정 이슈 엑셀 <span class="hint">(+ 표시된 행만 보고서에 들어갑니다)</span></label>
    <input type="file" id="excelFile" accept=".xlsx,.xltx,.xlsm">
    <div id="excelInfo" class="hint"></div>

    <label for="reportDate">보고서 날짜</label>
    <input type="date" id="reportDate">

    <label>작성 개수 <span class="hint">(2페이지 요약표 칸 수)</span></label>
    <div class="count-row">
      <label class="inline"><input type="checkbox" id="countAll" checked> 전체 <span class="hint">(+ 표시된 글을 차례대로 전부)</span></label>
      <span id="countOpts">
        총 <input type="number" id="countTotal" min="1" max="12" value="10">개 중
        <input type="number" id="countMine" min="1" max="12" value="5">개 작성
        <label class="inline part"><input type="radio" name="countPart" value="front"> 앞부분 작성</label>
        <label class="inline part"><input type="radio" name="countPart" value="back" checked> 뒷부분 작성</label>
        <span class="hint" id="countHint"></span>
      </span>
    </div>

    <div class="buttons">
      <button id="start" class="primary" disabled>캡처·요약 시작</button>
      <button id="stop" disabled>중지</button>
      <button id="build" class="primary" disabled>PPT 받기</button>
    </div>
    <div id="summary" class="summary"></div>

    <div id="items"></div>

    <p class="note">
      네이버 카페 글은 로그인된 이 크롬에서 작은 창으로 열어 캡처합니다(글 하나에 30~40초, 글 사이 4~8초 쉼).
      캡처하는 동안 크롬 위쪽에 "디버깅 중" 안내줄이 잠깐 보입니다(화면 캡처 기능 때문이며 끝나면 사라집니다).
      내가 열람할 수 있는 글만 캡처됩니다. 수집한 글·닉네임은 개인정보일 수 있으니 업무 보고 용도로만 쓰세요.
      AI 요약을 쓰면 게시글 본문·댓글 글자가 Anthropic(Claude)으로 전송됩니다(유료, 글 하나에 수십 원 수준).
    </p>
  </main>
  <script src="lib/anthropic-sdk.min.js"></script>
  <script src="zip.js"></script>
  <script src="excel.js"></script>
  <script src="imageproc.js"></script>
  <script src="layout.js"></script>
  <script src="pptx.js"></script>
  <script src="ai.js"></script>
  <script src="capture.js"></script>
  <script src="app.js"></script>
</body>
</html>
