<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GV90 데일리 DB</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="workBar" class="workbar" hidden>
    <div class="workbar-track"><div id="workBarFill" class="workbar-fill"></div></div>
    <div id="workBarText" class="workbar-text"></div>
  </div>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <img src="icons/logo-gv90.png" alt="GV90" class="logo">
        <h1>GV90(JG1) 온라인 게시물 일일 수집<span class="sub">데일리 DB — 보고일마다 수집한 게시물을 이 PC 크롬에 보관</span></h1>
        <span class="ver" id="ver"></span>
        <div class="tools"><a class="tool" href="gv90.html#settings">⚙ 설정</a></div>
      </div>
      <nav class="menu">
        <a href="gv90.html"><span class="num">1</span>🔍 게시물 수집</a>
        <a href="db.html" class="on"><span class="num">2</span>🗄 데일리 DB</a>
        <a href="dashboard.html"><span class="num">3</span>📊 대시보드</a>
        <span class="soon" title="댓글 수집·댓글 성향 분석은 다음 단계에서 붙입니다"><span class="num">4</span>💬 댓글 수집 (준비 중)</span>
      </nav>
    </div>
  </header>
  <main>
    <section>
      <h2 class="dbtitle">🗄 데일리 DB <span class="dbsub" id="dbSummary"></span></h2>
      <div class="hint">수집 화면에서 <b>엑셀 만들기</b>를 누를 때마다 그날(보고일) 게시물이 여기에 쌓입니다. 엑셀에서 고친 파일은 그 날짜에 <b>수정본 올리기</b>로 반영하세요(같은 URL 의 구분·주요 내용·성향을 바꿈).</div>
      <div class="buttons">
        <button id="importRaw" class="small">📂 기존 raw data 엑셀 등록</button>
        <button id="exportBackup" class="small">💾 백업 받기</button>
        <button id="importBackup" class="small">📥 백업 불러오기</button>
        <input type="file" id="rawFile" accept=".xlsx" hidden>
        <input type="file" id="fixFile" accept=".xlsx" hidden>
        <input type="file" id="backupFile" accept=".json" hidden>
      </div>
      <div class="row">
        <label class="inline">기간 엑셀 <input type="date" id="rangeFrom"> ~ <input type="date" id="rangeTo"></label>
        <button id="rangeXlsx" class="small getbtn">📥 기간 엑셀 받기</button>
      </div>
      <div id="info" class="hint"></div>
      <div class="tablewrap">
        <table class="dbtable" id="days">
          <thead><tr><th>보고일</th><th>수집 기간</th><th>게시물</th><th>채널별</th><th>성향별</th><th>댓글</th><th>파일</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="dayBox" hidden>
      <h2 id="dayTitle"></h2>
      <div class="row">
        <input type="text" id="dayFilter" class="full" placeholder="커뮤니티명·제목·주요 내용 검색" spellcheck="false">
        <select id="daySenti"><option value="">성향 전체</option><option>긍정</option><option>중립</option><option>부정</option><option>단순비난</option></select>
      </div>
      <div class="tablewrap">
        <table id="dayPosts">
          <thead><tr><th>연번</th><th>채널</th><th>커뮤니티명</th><th>게시일</th><th>구분</th><th>URL</th><th>주요 내용</th><th>성향</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="gv90-settings.js"></script>
  <script src="common.js"></script>
  <script src="news.js"></script>
  <script src="youtube.js"></script>
  <script src="community.js"></script>
  <script src="celebrate.js"></script>
  <script src="report-template.js"></script>
  <script src="gv90-analyze.js"></script>
  <script src="gv90-db.js"></script>
  <script src="gv90-xlsx.js"></script>
  <script src="gv90-ui.js"></script>
  <script src="db.js"></script>
</body>
</html>
